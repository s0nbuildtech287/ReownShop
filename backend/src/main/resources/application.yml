spring:
  application:
    name: reownshop-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reownshop}
    username: ${DB_USERNAME:reownshop}
    password: ${DB_PASSWORD:reownshop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

reownshop:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:reownshop-sandbox-secret}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
