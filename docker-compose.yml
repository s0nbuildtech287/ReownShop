services:
  postgres:
    image: postgres:16-alpine
    container_name: reownshop-postgres
    environment:
      POSTGRES_DB: reownshop
      POSTGRES_USER: reownshop
      POSTGRES_PASSWORD: reownshop
    ports:
      - "5432:5432"
    volumes:
      - reownshop-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: reownshop-redis
    ports:
      - "6379:6379"
    volumes:
      - reownshop-redis-data:/data

volumes:
  reownshop-postgres-data:
  reownshop-redis-data:
